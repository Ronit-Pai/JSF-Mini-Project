
services:
  mongodb:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./server
    expose:
      - "8080"
    environment:
      PORT: 8080
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/collabcanvas}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      WEBSOCKET_MAX_PAYLOAD_BYTES: ${WEBSOCKET_MAX_PAYLOAD_BYTES:-65536}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo-data:
