version: "3.8"
services:
  mongodb:
    image: mongo:7
    ports:
      - 27017:27017
    volumes:
      - mongo-data:/data/db
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/collabcanvas
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      - mongodb
volumes:
  mongo-data: {}
