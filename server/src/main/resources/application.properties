spring.application.name=collabcanvas
server.port=${PORT:8080}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/collabcanvas}
spring.data.mongodb.auto-index-creation=true
collabcanvas.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
collabcanvas.websocket.max-payload-bytes=${WEBSOCKET_MAX_PAYLOAD_BYTES:65536}
server.error.include-message=never
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health
